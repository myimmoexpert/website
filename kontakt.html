  <title>Kontakt – Immo.Expert</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #f4f6f9;
      --navy2: #ffffff;
      --navy3: #eef2f7;
      --gold:  #2b7a8c;
      --gold2: #1f5d6c;
      --muted: #64748b;
      --white: #101a2b;
      --green: #15803d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(244,246,249, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(43,122,140,0.15);
    }

    .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; color: var(--white); text-decoration: none; }
    .logo span { color: var(--gold); }
    nav ul { list-style: none; display: flex; gap: 36px; }
    nav ul a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
    nav ul a:hover { color: var(--white); }
    .nav-cta { background: var(--gold); color: var(--navy) !important; padding: 10px 22px; border-radius: 8px; font-weight: 600 !important; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(43,122,140,0.08) 0%, transparent 70%);
      top: -80px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .container {
      max-width: 560px;
      width: 100%;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .left .contact-info { align-items: center; }
    .left .contact-item { justify-content: center; text-align: left; }

    /* LEFT */
    .left .badge {
      display: inline-block;
      background: rgba(43,122,140,0.12);
      color: var(--gold);
      border: 1px solid rgba(43,122,140,0.3);
      border-radius: 50px;
      padding: 5px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .left h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .left h1 span { color: var(--gold); }

    .left p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .contact-info { display: flex; flex-direction: column; gap: 16px; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .contact-icon {
      width: 40px; height: 40px;
      background: rgba(43,122,140,0.1);
      border: 1px solid rgba(43,122,140,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .contact-item span { color: var(--muted); font-size: 0.9rem; }
    .contact-item a { color: var(--white); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .contact-item a:hover { color: var(--gold); }

    footer {
      border-top: 1px solid rgba(16,26,43,0.07);
      padding: 36px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links { display: flex; gap: 28px; list-style: none; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    .footer-links a:hover { color: var(--white); }
    .footer-copy { color: var(--muted); font-size: 0.82rem; }

    @media (max-width: 750px) {
      nav { padding: 18px 24px; }
      nav ul { display: none; }
      .container { grid-template-columns: 1fr; gap: 40px; }
      footer { padding: 28px 24px; flex-direction: column; align-items: flex-start; }
    }
  </style>
  <link rel="stylesheet" href="app.css" />

    .card, .info-card, .auth-card, .legal-card, .kontakt-card,

        </div>
      </div>

    </div>

    <span class="footer-copy">© 2026 Immo.Expert</span>
