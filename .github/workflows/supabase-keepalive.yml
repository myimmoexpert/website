name: Supabase aktiv halten

# Fragt alle 3 Tage einmal die Datenbank ab, damit Supabase das
# Free-Projekt nicht nach 7 Tagen Inaktivitaet pausiert.
# Benoetigt zwei Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL  z. B. https://<projekt-ref>.supabase.co
#   SUPABASE_KEY  der publishable Key aus Supabase -> Project Settings -> API

on:
  schedule:
    - cron: '17 6 */3 * *'   # alle 3 Tage um 06:17 UTC
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets SUPABASE_URL und SUPABASE_KEY fehlen." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/steckbriefe?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
          echo
          echo "Supabase hat geantwortet."
